<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Push keys · Village Tracker</title>
<style>
:root{color-scheme:dark;--bg:#0d0e0b;--ink:#ece6d6;--muted:#857f6f;--gold:#e9b949;--line:rgba(236,230,214,.18)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:15px/1.55 system-ui,-apple-system,"Segoe UI",sans-serif;padding:24px}
main{width:min(640px,100%);display:grid;gap:16px}
h1{font-size:40px;line-height:1;margin:0;font-weight:900}h1 em{font-style:normal;color:var(--gold)}
p{margin:0;color:#bdb7a6}label{display:grid;gap:6px;font-size:12px;color:var(--muted);letter-spacing:.04em}
.row{display:flex;gap:8px}textarea{flex:1;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;color:var(--ink);background:transparent;border:1px solid var(--line);border-radius:10px;padding:10px;resize:none;height:64px}
button{font:inherit;font-weight:700;border:0;border-radius:999px;padding:12px 18px;cursor:pointer;background:var(--gold);color:#1a1405}
button.ghost{background:transparent;color:var(--ink);box-shadow:inset 0 0 0 1px var(--line);padding:8px 14px;font-size:13px}
.warn{font-size:13px;color:#ff8a6e}
</style></head><body><main>
<h1>Push <em>keys</em></h1>
<p>Makes the two keys that let your tracker send reminders to your phone. They are made here in your browser and never sent anywhere.</p>
<button id="go" type="button">Make my keys</button>
<label>Public key: goes in <b>public/config.js</b> as vapidPublicKey, and in Supabase as the secret VAPID_PUBLIC
  <span class="row"><textarea id="pub" readonly></textarea><button class="ghost" type="button" data-copy="pub">Copy</button></span></label>
<label>Private key: goes ONLY in Supabase as the secret VAPID_PRIVATE. Never commit it to GitHub.
  <span class="row"><textarea id="priv" readonly></textarea><button class="ghost" type="button" data-copy="priv">Copy</button></span></label>
<p class="warn">Make keys once. Making new ones later means turning push reminders on again on every device.</p>
</main>
<script>
const b64u=buf=>btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
document.getElementById("go").onclick=async()=>{
  const k=await crypto.subtle.generateKey({name:"ECDSA",namedCurve:"P-256"},true,["sign","verify"]);
  document.getElementById("pub").value=b64u(await crypto.subtle.exportKey("raw",k.publicKey));
  document.getElementById("priv").value=(await crypto.subtle.exportKey("jwk",k.privateKey)).d;
};
document.addEventListener("click",async e=>{ const id=e.target.dataset.copy; if(!id) return; const v=document.getElementById(id).value; if(!v) return; try{ await navigator.clipboard.writeText(v); e.target.textContent="Copied"; setTimeout(()=>e.target.textContent="Copy",1500);}catch(err){ document.getElementById(id).select(); } });
</script></body></html>
