name: Refresh game data
on:
  schedule: [{ cron: "17 3 * * 1" }]   # Mondays 03:17 UTC
  workflow_dispatch:
permissions: { contents: write }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node scripts/build-game-data.mjs
        env:
          GAME_DATA_URL: ${{ vars.GAME_DATA_URL }}
      - run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add public/game-data.json
          git diff --cached --quiet || git commit -m "Refresh game data"
          git push
